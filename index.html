<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">

    <title>Official Shoutul Masteja</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* Pengaturan Dasar */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #121212; /* Hitam pekat */
            color: #FFD700; /* Kuning emas */
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
        }

        .container {
            text-align: center;
            padding: 20px;
            max-width: 1000px;
        }

        .badge {
            display: block;
            text-transform: uppercase;
            font-size: 0.8rem;
            letter-spacing: 3px;
            margin-bottom: 10px;
            opacity: 0.8;
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 40px;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: #FFD700;
            border-bottom: 2px solid #FFD700;
            padding-bottom: 10px;
            display: inline-block;
        }

        /* Grouping Icon */
        .menu-wrapper {
            display: flex;
            gap: 30px;
            justify-content: center;
            flex-wrap: wrap;
            margin-bottom: 30px;
        }

        /* Desain Kartu Menu */
        .menu-card {
            text-decoration: none;
            color: #FFD700;
            background: #1e1e1e;
            padding: 30px;
            border-radius: 15px;
            width: 180px;
            transition: all 0.3s ease;
            border: 1px solid #333;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .menu-card:hover {
            transform: translateY(-10px);
            background: #FFD700;
            color: #121212;
            box-shadow: 0 15px 40px rgba(255, 215, 0, 0.3);
        }

        .menu-card i {
            font-size: 3.5rem;
            margin-bottom: 15px;
        }

        .menu-card p {
            font-size: 1rem;
            font-weight: bold;
            text-transform: uppercase;
            text-align: center;
        }

        /* Area Pengumuman & Tombol-tombol */
        .dev-section {
            margin-top: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
        }

        .dev-notice {
            font-size: 0.9rem;
            color: #bfa100; 
            letter-spacing: 1px;
        }

        /* Container Tombol agar sejajar rapi */
        .button-group {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            justify-content: center;
        }

        /* Desain Tombol Umum */
        .btn-action {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            background-color: #1e1e1e;
            color: #FFD700;
            padding: 12px 25px;
            border-radius: 30px;
            text-decoration: none;
            font-weight: bold;
            font-size: 0.95rem;
            border: 1px solid #FFD700;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(255, 215, 0, 0.1);
        }

        .btn-action:hover {
            background-color: #FFD700;
            color: #121212;
            transform: translateY(-3px);
            box-shadow: 0 6px 20px rgba(255, 215, 0, 0.4);
        }

        /* Desain Khusus Tombol WhatsApp (Warna Hijau Khas WA) */
        .btn-whatsapp {
            border-color: #25D366;
            color: #25D366;
        }

        .btn-whatsapp:hover {
            background-color: #25D366;
            color: #ffffff;
            box-shadow: 0 6px 20px rgba(37, 211, 102, 0.4);
        }

        /* Efek Responsif */
        @media (max-width: 650px) {
            .menu-wrapper {
                gap: 15px;
                margin-bottom: 20px;
            }
            .menu-card {
                width: 140px;
                padding: 20px;
            }
            .menu-card i {
                font-size: 2.5rem;
            }
            h1 {
                font-size: 1.8rem;
            }
            .dev-notice {
                font-size: 0.8rem;
            }
            .btn-action {
                padding: 10px 18px;
                font-size: 0.85rem;
            }
        }
    </style>
</head>
<body>

        <!-- Bagian Info & Tombol Tautan -->

            <p class="dev-notice">

            </p>
            
            <div class="button-group">

                    <i class="fab fa-whatsapp"></i> Kirim Masukan
                </a>
            </div>
        </div>
    </div>
