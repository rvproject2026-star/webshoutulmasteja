<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Koleksi Video & Media - Shoutul Masteja</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
     <!-- Meta Tags SEO & Deskripsi -->
    <meta name="description" content="Official Platform Shoutul Masteja - Kumpulan teks lirik sholawat lengkap, rumus ketukan rebana, dan dokumentasi kegiatan hadroh." />
    <meta name="keywords" content="sholawat, lirik sholawat, hadroh, shoutul masteja, rumus tabuhan rebana" />
    <meta name="author" content="Shoutul Masteja Official" />

    <!-- Favicon / Logo Kecil di Tab Browser & Hasil Pencarian -->
    <link rel="icon" type="image/png" href="logo-masteja.png">
    <link rel="apple-touch-icon" href="logo-masteja.png">
    <style>
        :root {
            --primary: #FFD700;
            --primary-dark: #b89b00;
            --bg-light: #f8f9fa;
            --card-bg: #fdfbf7; /* Warna Cream Lembut */
            --text-dark: #212529;
            --text-gray: #555555;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', 'Segoe UI', sans-serif; }
        body { background-color: var(--bg-light); color: var(--text-dark); line-height: 1.7; scroll-behavior: smooth; }

        /* Navigation */
        nav {
            background: rgba(255, 255, 255, 0.95);
            padding: 15px 20px;
            position: sticky;
            top: 0;
            z-index: 1000;
            border-bottom: 3px solid var(--primary);
            backdrop-filter: blur(10px);
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }

        .nav-container {
            display: flex;
            align-items: center;
            justify-content: space-between;
            max-width: 1200px;
            margin: 0 auto;
        }

        .brand-logo-img {
            display: flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
        }

        .brand-logo-img img {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid var(--primary);
            background-color: #121212;
            box-shadow: 0 0 10px rgba(255, 215, 0, 0.3);
        }

        .brand-logo-text .title {
            font-size: 0.95rem;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #111;
            line-height: 1.2;
        }

        .brand-logo-text .subtitle {
            font-size: 0.65rem;
            color: var(--primary-dark);
            font-weight: bold;
            letter-spacing: 1.5px;
            text-transform: uppercase;
        }

        .nav-back-btn {
            background: #111;
            color: var(--primary);
            border: 1px solid var(--primary);
            padding: 8px 16px;
            border-radius: 8px;
            text-decoration: none;
            font-size: 0.85rem;
            font-weight: bold;
            transition: 0.3s;
        }

        .nav-back-btn:hover {
            background: var(--primary);
            color: #000;
        }

        /* Header Info */
        header { 
            text-align: center; 
            max-width: 800px;
            margin: 30px auto 20px;
            padding: 0 20px;
        }
        
        h1 { 
            color: #111; 
            margin-bottom: 10px; 
            font-size: 1.6rem; 
            text-transform: uppercase; 
            letter-spacing: 2px;
        }

        header p {
            color: var(--text-gray);
            font-size: 0.9rem;
        }
        
        /* Gallery Grid */
        .gallery { 
            display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); 
            gap: 25px; 
            max-width: 1200px; 
            margin: 30px auto; 
            padding: 0 20px;
        }

        .card { 
            background: var(--card-bg); 
            border-radius: 15px; 
            overflow: hidden; 
            border: 2px solid #222; 
            border-left: 8px solid var(--primary);
            box-shadow: 0 8px 25px rgba(0,0,0,0.08);
            transition: 0.3s; 
            animation: fadeIn 0.5s ease;
        }

        .card:hover { 
            transform: translateY(-5px); 
            box-shadow: 0 12px 30px rgba(0,0,0,0.12);
        }
        
        .media-container { 
            width: 100%; 
            height: 200px; 
            background: #000; 
        }

        .card video, .card img { 
            width: 100%; 
            height: 100%; 
            object-fit: cover; 
            display: block; 
        }

        /* Tambahan kursor pointer khusus untuk foto agar keliatan bisa diklik */
        .card img {
            cursor: pointer;
            transition: opacity 0.2s;
        }
        .card img:hover {
            opacity: 0.9;
        }
        
        .info { 
            padding: 20px; 
            text-align: center; 
        }

        .info span { 
            font-size: 0.95rem; 
            font-weight: bold; 
            color: #111; 
            display: block; 
            margin-bottom: 15px; 
        }
        
        .btn-dl { 
            display: inline-block; 
            background: #111; 
            color: var(--primary); 
            padding: 10px 20px; 
            border-radius: 8px; 
            text-decoration: none; 
            font-weight: bold; 
            font-size: 0.85rem; 
            border: 1px solid var(--primary);
            transition: 0.3s; 
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
        }

        .btn-dl:hover { 
            background: var(--primary); 
            color: #000; 
            transform: translateY(-2px);
            box-shadow: 0 6px 15px rgba(255, 215, 0, 0.3);
        }

        @keyframes fadeIn { 
            from { opacity: 0; transform: translateY(20px); } 
            to { opacity: 1; transform: translateY(0); } 
        }

        /* FULL SCREEN MODAL / LIGHTBOX STYLING */
        #fullscreen-modal {
            display: none;
            position: fixed;
            z-index: 9999;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.9);
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        #fullscreen-modal img {
            max-width: 90%;
            max-height: 90vh;
            object-fit: contain;
            border-radius: 8px;
            box-shadow: 0 5px 25px rgba(0,0,0,0.5);
            animation: zoomIn 0.3s ease;
        }

        #fullscreen-modal .close-btn {
            position: absolute;
            top: 20px;
            right: 30px;
            color: #fff;
            font-size: 40px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        #fullscreen-modal .close-btn:hover {
            color: var(--primary);
        }

        @keyframes zoomIn {
            from { transform: scale(0.8); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        /* Footer */
        footer { 
            text-align: center; 
            padding: 40px 20px; 
            color: #666; 
            font-size: 0.8rem; 
            background: #ffffff; 
            border-top: 1px solid #e5e5e5; 
            margin-top: 50px;
        }
    </style>
</head>
<body>

<nav>
    <div class="nav-container">
        <a href="index.html" class="brand-logo-img">
            <img src="logo-masteja.png" alt="Logo">
            <div class="brand-logo-text">
                <div class="title">Shoutul Masteja</div>
                <div class="subtitle">Hadroh Official</div>
            </div>
        </a>
        <a href="index.html" class="nav-back-btn"><i class="fas fa-home"></i> Kembali ke Beranda</a>
    </div>
</nav>

<header>
    <h1>Koleksi Video & Media</h1>
    <p>Pusat arsip dan galeri kenangan digital untuk mengabadikan momen kebersamaan Shoutul Masteja Versi 3.4</p>
</header>

<div class="gallery" id="gallery"></div>

<!-- ELEMEN MODAL FULL SCREEN FOTO -->
<div id="fullscreen-modal">
    <span class="close-btn" id="close-modal">&times;</span>
    <img id="modal-img" src="" alt="Full Screen Preview">
</div>

<footer>
    <p>Database Media Versi 3.4 barudak shoutul masteja - Update 2025</p>
    <p style="margin: 5px 0;">dung tak tak adun muid</p>
    <p style="margin-top: 10px; color: var(--primary-dark); font-weight: bold;">Shollu 'alan Nabi Muhammad!</p>
</footer>

<script>
    const gallery = document.getElementById('gallery');

    // =========================================================
    // PENGATURAN OTOMATIS
    // =========================================================
    const jumlahVideo = 5; // GANTI ANGKA INI SESUAI JUMLAH VIDEO ANDA
    const formatFile = ".mp4"; // GANTI JIKA FORMATNYA .WEBM ATAU LAINNYA
    const folderPath = ""; // ISI JIKA VIDEO ADA DI DALAM FOLDER (MISAL: "videos/")
    
    function loadGallery() {
        gallery.innerHTML = '';
        
        // Load Video
        for (let i = 1; i <= jumlahVideo; i++) {
            const fileName = `vid${i}${formatFile}`;
            const filePath = folderPath + fileName;
            
            const card = document.createElement('div');
            card.className = 'card';
            card.innerHTML = `
                <div class="media-container">
                    <video src="${filePath}#t=1.0" preload="metadata" controls></video>
                </div>
                <div class="info">
                    <span>Video Bagian ${i}</span>
                    <a href="${filePath}" download="${fileName}" class="btn-dl"><i class="fas fa-download"></i> DOWNLOAD MP4</a>
                </div>
            `;
            gallery.appendChild(card);
        }

        // Load Foto
        const jumlahPoto = 7; // Ganti sesuai jumlah foto Anda
        for (let j = 1; j <= jumlahPoto; j++) {
            const fileName = `poto${j}.jpg`; // Pastikan namanya poto1.jpg, poto2.jpg, dst
            const card = document.createElement('div');
            card.className = 'card';
            card.innerHTML = `
                <div class="media-container">
                    <img src="${fileName}" alt="Foto ${j}" class="clickable-photo" data-src="${fileName}">
                </div>
                <div class="info">
                    <span>Gambar Ke-${j}</span>
                    <a href="${fileName}" download="${fileName}" class="btn-dl"><i class="fas fa-download"></i> DOWNLOAD JPG</a>
                </div>
            `;
            gallery.appendChild(card);
        }

        // Aktifkan Event Listener untuk Foto Full Screen setelah elemen dibuat
        initFullscreenPhoto();
    }

    // Fungsi untuk menampilkan Modal Full Screen
    function initFullscreenPhoto() {
        const modal = document.getElementById('fullscreen-modal');
        const modalImg = document.getElementById('modal-img');
        const closeBtn = document.getElementById('close-modal');
        const photos = document.querySelectorAll('.clickable-photo');

        photos.forEach(photo => {
            photo.addEventListener('click', function() {
                modal.style.display = 'flex';
                modalImg.src = this.getAttribute('data-src');
            });
        });

        // Tutup modal ketika tombol X diklik
        closeBtn.addEventListener('click', function() {
            modal.style.display = 'none';
        });

        // Tutup modal jika area gelap di luar foto diklik
        modal.addEventListener('click', function(e) {
            if (e.target === modal) {
                modal.style.display = 'none';
            }
        });
    }

    // Jalankan fungsi
    loadGallery();
</script>

</body>
</html>
