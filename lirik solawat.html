<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arsip Lirik Sholawat Lengkap - Dark Gold</title>
    <link href="https://fonts.googleapis.com/css2?family=Amiri&display=swap" rel="stylesheet">

    <style>
        :root {
            --primary: #FFD700;
            --bg-dark: #0a0a0a;
            --card-bg: #161616;
            --text-gray: #b0b0b0;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', 'Segoe UI', sans-serif; }
        body { background-color: var(--bg-dark); color: #fff; line-height: 1.7; scroll-behavior: smooth; }

        /* Navigation */
        nav {
            background: rgba(10, 10, 10, 0.95);
            padding: 10px;
            position: sticky;
            top: 0;
            z-index: 1000;
            border-bottom: 2px solid var(--primary);
            text-align: center;
            backdrop-filter: blur(10px);
        }

        nav h1 { color: var(--primary); font-size: 1.2rem; text-transform: uppercase; margin-bottom: 5px; letter-spacing: 2px; }

        .search-box {
            width: 100%;
            max-width: 500px;
            padding: 8px 20px;
            border-radius: 30px;
            border: 1px solid #333;
            background: #222;
            color: white;
            outline: none;
            font-size: 0.9rem;
            transition: 0.3s;
        }

        .search-box:focus { border-color: var(--primary); box-shadow: 0 0 15px rgba(255, 215, 0, 0.3); }

        /* Layout */
        .container { max-width: 800px; margin: 30px auto; padding: 0 20px; }

        .lirik-item {
            background: var(--card-bg);
            border-radius: 15px;
            margin-bottom: 40px;
            padding: 30px;
            border-left: 5px solid var(--primary);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            animation: fadeIn 0.5s ease;
            text-align: center;
        }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

        .lirik-item h2 { color: var(--primary); margin-bottom: 25px; font-size: 1.8rem; text-align: center; border-bottom: 1px solid #333; padding-bottom: 10px; }

        .teks-arab {
            font-size: 1.8rem;
            text-align: center;
            direction: rtl;
            line-height: 2;
            margin-bottom: 20px;
            font-family: 'Amiri', 'Traditional Arabic', serif;
            color: #ffffff;
            word-spacing: 4px;
        }

        .teks-latin {
            color: var(--primary);
            font-weight: 500;
            margin-bottom: 15px;
            font-size: 1rem;
            border-left: 2px solid #333;
            padding-left: 15px;
            text-align: left;
            direction: ltr;
        }

        .terjemah {
            color: var(--text-gray);
            font-style: italic;
            font-size: 0.9rem;
            margin-top: 10px;
            text-align: left;
            direction: ltr;
        }

        .badge { background: var(--primary); color: black; padding: 2px 10px; border-radius: 5px; font-size: 0.7rem; font-weight: bold; vertical-align: middle; margin-left: 10px; }

        /* Footer */
        footer { text-align: center; padding: 50px; color: var(--text-gray); font-size: 0.8rem; background: #050505; border-top: 1px solid #222; }

        @media (max-width: 600px) { 
            .teks-arab { font-size: 1.5rem; }
            .lirik-item { padding: 15px; }
        }

        /* Loading Screen Styles */
        #loader-wrapper {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: var(--bg-dark);
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            z-index: 9999;
            transition: opacity 0.5s ease;
        }
        .rebana-container {
            width: 100px; height: 100px;
            border: 8px solid var(--primary);
            border-radius: 50%;
            position: relative; margin-bottom: 20px;
            display: flex; justify-content: center; align-items: center;
            animation: hit-rebana 0.4s infinite alternate;
        }
        .rebana-inner { width: 80%; height: 80%; border: 2px solid var(--primary); border-radius: 50%; opacity: 0.5; }
        .loading-text { color: var(--primary); font-size: 1.5rem; font-weight: bold; height: 30px; }
        .loading-text::after { content: "DUNG"; animation: text-switch 2s infinite; }
        .progress-bar { width: 200px; height: 4px; background: #222; border-radius: 10px; margin-top: 20px; overflow: hidden; }
        .progress-fill { width: 100%; height: 100%; background: var(--primary); animation: loading-fill 2s infinite ease-in-out; }

        @keyframes hit-rebana { from { transform: scale(1); } to { transform: scale(1.1); box-shadow: 0 0 30px rgba(255, 215, 0, 0.4); } }
        @keyframes text-switch { 0%, 32% { content: "DUNG"; } 33%, 65% { content: "TAKTAK"; } 66%, 100% { content: "TAKTAK ADUN"; } }
        @keyframes loading-fill { 0% { transform: translateX(-100%); } 100% { transform: translateX(100%); } }

        /* Sidebar Styles */
        .sidebar {
            position: fixed; top: 0; left: -300px; width: 300px; height: 100%;
            background: var(--card-bg); z-index: 2000; transition: 0.4s;
            box-shadow: 5px 0 15px rgba(0,0,0,0.5); border-right: 2px solid var(--primary);
            display: flex; flex-direction: column;
        }
        .sidebar.active { left: 0; }
        .sidebar-header { padding: 20px; border-bottom: 1px solid #333; display: flex; justify-content: space-between; align-items: center; }
        .sidebar-content { overflow-y: auto; padding: 10px 0; }
        .sidebar-link { display: block; padding: 12px 20px; color: var(--text-gray); text-decoration: none; border-bottom: 1px solid #222; font-size: 0.95rem; transition: 0.3s; }
        .sidebar-link:hover { background: #222; color: var(--primary); padding-left: 30px; }
        #overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); display: none; z-index: 1500; }
        #overlay.active { display: block; }
    </style>
</head>
<body>
  <div id="loader-wrapper">
    <div class="rebana-container"><div class="rebana-inner"></div></div>
    <div class="loading-text"></div>
    <div class="progress-bar"><div class="progress-fill"></div></div>
</div>

<nav>
    <div style="display: flex; align-items: center; justify-content: space-between; max-width: 800px; margin: 0 auto 5px;">
        <button id="menuBtn" onclick="toggleSidebar()" style="background: none; border: 1px solid var(--primary); color: var(--primary); padding: 5px 10px; border-radius: 5px; cursor: pointer;">☰ Menu</button>
        <h1 style="margin-bottom: 0;">Shoutul Masteja</h1>
        <div style="width: 50px;"></div> 
    </div>
    <input type="text" id="searchInput" class="search-box" placeholder="Teangan Judul atawa Lirikna....." onkeyup="filterLirik()">
</nav>

<div id="sidebar" class="sidebar">
    <div class="sidebar-header">
        <h3>Daftar Isi</h3>
        <button onclick="toggleSidebar()" style="color: var(--primary); background: none; border: none; font-size: 1.5rem;">&times;</button>
    </div>
    <div id="daftarIsi" class="sidebar-content"></div>
</div>

<div id="overlay" onclick="toggleSidebar()"></div>

<!-- KONTEN LIRIK DIMASUKKAN DI SINI -->
<div class="container" id="lirikContainer">
    <!-- Data lirik diletakkan di area ini -->
</div>

<footer>
    <p>Database Sholawat Versi 3.0 barudak shoutul masteja - Update 2025</p>
    <p>dung tak tak adun muid</p>
    <p style="margin-top: 10px; color: var(--primary);">Shollu 'alan Nabi Muhammad!</p>
</footer>

<!-- Masukkan SDK Firebase versi Modular di bagian bawah sebelum menutup body -->
<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getDatabase, ref, get } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

   // For Firebase JS SDK v7.20.0 and later, measurementId is optional
const firebaseConfig = {
  apiKey: "AIzaSyBugJ590wIKNi3r1HHnyTyl4a1YJSSPhds",
  authDomain: "shoutulmastejachat.firebaseapp.com",
  databaseURL: "https://shoutulmastejachat-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "shoutulmastejachat",
  storageBucket: "shoutulmastejachat.firebasestorage.app",
  messagingSenderId: "40109384180",
  appId: "1:40109384180:web:791ca0d9a012e3288699a1",
  measurementId: "G-QGQLC2BJBZ"
};
    // Inisialisasi Firebase
    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    // 2. Fungsi untuk Mengambil Data dan Menampilkannya ke HTML
    async function muatLirikDariFirebase() {
        const container = document.getElementById('lirikContainer');
        container.innerHTML = "<p style='text-align:center; color:var(--primary);'>Memuat lirik dari database...</p>";

        try {
            const dbRef = ref(db, 'sholawat');
            const snapshot = await get(dbRef);

            if (snapshot.exists()) {
                const data = snapshot.val();
                container.innerHTML = ""; // Bersihkan teks loading

                // Looping data dari Firebase (karena bentuknya objek dengan key '1', '2', dst)
                Object.keys(data).forEach((key, index) => {
                    const item = data[key];
                    
                    // Format teks arab (ganti newline \n jadi tag <br> agar enter-nya terbaca)
                    const formatArab = item.teks_arab ? item.teks_arab.replace(/\n/g, '<br>') : '';
                    const formatLatin = item.teks_latin ? item.teks_latin.replace(/\n/g, '<br>') : '';
                    const terjemahText = item.terjemah ? `<div class="terjemah">Artinya: ${item.terjemah}</div>` : '';
                    const latinContainer = item.teks_latin ? `<div class="teks-latin">${formatLatin}</div>` : '';
                    const badgeKategori = item.kategori ? `<span class="badge">${item.kategori}</span>` : '';

                    // Buat elemen HTML untuk setiap lirik
                    const lirikDiv = document.createElement('div');
                    lirikDiv.className = 'lirik-item';
                    lirikDiv.innerHTML = `
                        <h2>${item.judul} ${badgeKategori}</h2>
                        <div class="teks-arab">${formatArab}</div>
                        ${latinContainer}
                        ${terjemahText}
                    `;
                    container.appendChild(lirikDiv);
                });

                // Setelah elemen HTML lirik selesai dibuat, jalankan fungsi daftar isi & loader
                generateDaftarIsi();
                hilangkanLoader();

            } else {
                container.innerHTML = "<p style='text-align:center;'>Belum ada data lirik di database.</p>";
                hilangkanLoader();
            }
        } catch (error) {
            console.error("Gagal mengambil data:", error);
            container.innerHTML = "<p style='text-align:center; color:red;'>Gagal terhubung ke database Firebase.</p>";
            hilangkanLoader();
        }
    }

    // Jalankan fungsi saat halaman dibuka
    window.addEventListener("DOMContentLoaded", muatLirikDariFirebase);
</script>

<script>
// Fungsi pendukung tampilan (Sidebar & Loader)
function hilangkanLoader() {
    const loader = document.getElementById("loader-wrapper");
    setTimeout(() => {
        loader.style.opacity = "0";
        setTimeout(() => { loader.style.display = "none"; }, 500);
    }, 500);
}

function toggleSidebar() {
    document.getElementById("sidebar").classList.toggle("active");
    document.getElementById("overlay").classList.toggle("active");
    document.body.classList.toggle("sidebar-open");
}

function generateDaftarIsi() {
    const items = document.getElementsByClassName('lirik-item');
    const container = document.getElementById('daftarIsi');
    container.innerHTML = ""; // Reset isi sidebar agar tidak duplikat
    
    for (let i = 0; i < items.length; i++) {
        let h2Element = items[i].getElementsByTagName('h2')[0];
        // Ambil teks judul saja tanpa teks badge di dalamnya
        let title = h2Element.childNodes[0].nodeValue ? h2Element.childNodes[0].nodeValue.trim() : h2Element.innerText;
        
        items[i].setAttribute('id', 'lirik-' + i);
        let link = document.createElement('a');
        link.href = '#lirik-' + i;
        link.className = 'sidebar-link';
        link.innerText = title;
        link.onclick = toggleSidebar;
        container.appendChild(link);
    }
}

function filterLirik() {
    let input = document.getElementById('searchInput').value.toLowerCase();
    let items = document.getElementsByClassName('lirik-item');
    for (let i = 0; i < items.length; i++) {
        let title = items[i].getElementsByTagName('h2')[0].innerText.toLowerCase();
        let body = items[i].innerText.toLowerCase();
        if (title.includes(input) || body.includes(input)) {
            items[i].style.display = "block";
        } else {
            items[i].style.display = "none";
        }
    }
}
</script>
</body>
</html>
