<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profil Personil - Shoutul Masteja</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Meta Tags SEO & Deskripsi -->
    <meta name="description" content="Profil Personil Resmi Shoutul Masteja - Kenali lebih dekat para anggota dan pengurus grup hadroh." />
    <meta name="keywords" content="profil personil, anggota shoutul masteja, hadroh, sholawat" />
    <meta name="author" content="Shoutul Masteja Official" />

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="logo-masteja.png">
    <link rel="apple-touch-icon" href="logo-masteja.png">

    <style>
        :root {
            --primary: #FFD700;
            --primary-dark: #b89b00;
            --bg-light: #f4f6f8;
            --card-bg: #ffffff;
            --text-dark: #1e293b;
            --text-gray: #64748b;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { background-color: var(--bg-light); color: var(--text-dark); line-height: 1.6; }

        /* Navigation */
        nav {
            background: rgba(255, 255, 255, 0.9);
            padding: 15px 20px;
            position: sticky;
            top: 0;
            z-index: 1000;
            border-bottom: 2px solid #e2e8f0;
            backdrop-filter: blur(10px);
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.02);
        }

        .nav-container {
            display: flex;
            align-items: center;
            justify-content: space-between;
            max-width: 1000px;
            margin: 0 auto;
        }

        .brand-logo-img {
            display: flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
        }

        .brand-logo-img img {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid var(--primary);
            background-color: #121212;
        }

        .brand-logo-text .title {
            font-size: 0.9rem;
            font-weight: 800;
            text-transform: uppercase;
            color: #111;
        }

        .brand-logo-text .subtitle {
            font-size: 0.6rem;
            color: var(--primary-dark);
            font-weight: bold;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .nav-back-btn {
            background: #111;
            color: var(--primary);
            padding: 7px 14px;
            border-radius: 6px;
            text-decoration: none;
            font-size: 0.8rem;
            font-weight: bold;
            transition: 0.2s;
        }

        .nav-back-btn:hover {
            background: var(--primary);
            color: #000;
        }

        /* Header Info */
        header { 
            text-align: center; 
            max-width: 700px;
            margin: 40px auto 30px;
            padding: 0 20px;
        }
        
        h1 { 
            color: #0f172a; 
            margin-bottom: 8px; 
            font-size: 1.8rem; 
            text-transform: uppercase; 
            letter-spacing: 1px;
        }

        header p {
            color: var(--text-gray);
            font-size: 0.88rem;
        }

        /* Profile Layout */
        .profile-container {
            max-width: 850px;
            margin: 0 auto 50px;
            padding: 0 20px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .profile-card {
            background: var(--card-bg);
            border-radius: 16px;
            padding: 24px;
            display: flex;
            align-items: center;
            gap: 24px;
            border: 1px solid #e2e8f0;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.04);
            transition: all 0.3s ease;
            position: relative;
            overflow: visible;
        }

        .profile-card::before {
            content: '';
            position: absolute;
            left: 0;
            top: 0;
            height: 100%;
            width: 5px;
            background: var(--primary);
            border-top-left-radius: 16px;
            border-bottom-left-radius: 16px;
        }

        .profile-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 30px -5px rgba(0, 0, 0, 0.08);
            border-color: #cbd5e1;
        }

        /* Tombol Titik Tiga */
        .card-menu-btn {
            position: absolute;
            top: 15px;
            right: 15px;
            background: #f1f5f9;
            border: none;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #475569;
            font-size: 0.9rem;
            transition: 0.2s;
            z-index: 10;
        }

        .card-menu-btn:hover {
            background: var(--primary);
            color: #000;
        }

        /* Dropdown Menu Popup */
        .card-dropdown-menu {
            display: none;
            position: absolute;
            top: 50px;
            right: 15px;
            background: #ffffff;
            border: 1px solid #e2e8f0;
            border-radius: 10px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            padding: 6px;
            z-index: 20;
            min-width: 170px;
            animation: fadeInMenu 0.2s ease;
        }

        .card-dropdown-menu.active {
            display: block;
        }

        .dropdown-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 9px 12px;
            font-size: 0.8rem;
            color: #334155;
            text-decoration: none;
            background: none;
            border: none;
            width: 100%;
            text-align: left;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 500;
        }

        .dropdown-item:hover {
            background: #f8fafc;
            color: #0f172a;
        }

        .dropdown-item i {
            color: #25D366;
        }

        @keyframes fadeInMenu {
            from { opacity: 0; transform: translateY(-5px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .profile-avatar-wrapper {
            flex-shrink: 0;
            width: 100px;
            height: 100px;
            border-radius: 50%;
            overflow: hidden;
            border: 3px solid var(--primary);
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            background: #000;
        }

        .profile-avatar-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            cursor: pointer;
            transition: transform 0.3s ease, opacity 0.2s;
        }

        .profile-avatar-wrapper img:hover {
            transform: scale(1.08);
            opacity: 0.9;
        }

        .profile-details {
            flex-grow: 1;
            padding-right: 25px;
        }

        .profile-name-tag {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 6px;
        }

        .profile-name {
            font-size: 1.15rem;
            font-weight: 700;
            color: #0f172a;
        }

        .profile-badge {
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            padding: 4px 10px;
            background: #fef3c7;
            color: #92400e;
            border-radius: 20px;
            font-weight: 700;
        }

        .profile-desc {
            font-size: 0.85rem;
            color: var(--text-gray);
            line-height: 1.5;
        }

        /* MODAL FULL SCREEN FOTO */
        #fullscreen-modal {
            display: none;
            position: fixed;
            z-index: 9999;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.9);
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        #fullscreen-modal img {
            max-width: 90%;
            max-height: 90vh;
            object-fit: contain;
            border-radius: 8px;
            box-shadow: 0 5px 25px rgba(0,0,0,0.5);
        }

        #fullscreen-modal .close-btn {
            position: absolute;
            top: 20px;
            right: 30px;
            color: #fff;
            font-size: 40px;
            font-weight: bold;
            cursor: pointer;
        }

        /* MODAL KHUSUS OPSI BERBAGI GAMBAR (PC & HP FRIENDLY) */
        #share-modal {
            display: none;
            position: fixed;
            z-index: 9999;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.75);
            justify-content: center;
            align-items: center;
            padding: 20px;
            backdrop-filter: blur(5px);
        }

        .share-modal-content {
            background: #fff;
            padding: 24px;
            border-radius: 16px;
            max-width: 450px;
            width: 100%;
            text-align: center;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.2);
            animation: zoomIn 0.25s ease;
        }

        .share-modal-content h3 {
            margin-bottom: 12px;
            font-size: 1.1rem;
            color: #0f172a;
        }

        .share-preview-container {
            width: 100%;
            border-radius: 10px;
            overflow: hidden;
            border: 1px solid #e2e8f0;
            margin-bottom: 16px;
            background: #f8fafc;
        }

        .share-preview-container img {
            width: 100%;
            height: auto;
            display: block;
        }

        .share-action-buttons {
            display: flex;
            gap: 10px;
            justify-content: center;
        }

        .btn-wa {
            background: #25D366;
            color: white;
            border: none;
            padding: 10px 16px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 0.85rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            flex: 1;
            justify-content: center;
            text-decoration: none;
            transition: 0.2s;
        }

        .btn-wa:hover { background: #20ba5a; }

        .btn-download {
            background: #0f172a;
            color: white;
            border: none;
            padding: 10px 16px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 0.85rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            flex: 1;
            justify-content: center;
            transition: 0.2s;
        }

        .btn-download:hover { background: #334155; }

        .close-share-modal {
            margin-top: 15px;
            background: none;
            border: none;
            color: var(--text-gray);
            font-size: 0.85rem;
            cursor: pointer;
            font-weight: 500;
        }
        .close-share-modal:hover { color: #000; }

        @keyframes zoomIn {
            from { transform: scale(0.85); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        #share-canvas { display: none; }

        @media (max-width: 600px) {
            .profile-card {
                flex-direction: column;
                text-align: center;
                padding: 20px;
            }
            .profile-details { padding-right: 0; }
            .profile-name-tag { justify-content: center; }
            .profile-avatar-wrapper { width: 90px; height: 90px; margin: 0 auto; }
        }

        /* Footer */
        footer { 
            text-align: center; 
            padding: 30px 20px; 
            color: #666; 
            font-size: 0.8rem; 
            background: #ffffff; 
            border-top: 1px solid #e2e8f0; 
        }
    </style>
</head>
<body>

<nav>
    <div class="nav-container">
        <a href="index.html" class="brand-logo-img">
            <img src="logo-masteja.png" alt="Logo">
            <div class="brand-logo-text">
                <div class="title">Shoutul Masteja</div>
                <div class="subtitle">Hadroh Official</div>
            </div>
        </a>
        <a href="index.html" class="nav-back-btn"><i class="fas fa-home"></i> Beranda</a>
    </div>
</nav>

<header>
    <h1>Profil Personil</h1>
    <p>Daftar resmi anggota, pengurus, dan punggawa group hadroh Shoutul Masteja</p>
</header>

<div class="profile-container" id="profile-container"></div>

<!-- MODAL FULL SCREEN FOTO -->
<div id="fullscreen-modal">
    <span class="close-btn" id="close-modal">&times;</span>
    <img id="modal-img" src="" alt="Full Screen Preview">
</div>

<!-- MODAL PREVIEW BERBAGI (UNTUK PC & HP) -->
<div id="share-modal">
    <div class="share-modal-content">
        <h3>Kartu Profil Siap Dibagikan!</h3>
        <div class="share-preview-container">
            <img id="share-result-img" src="" alt="Preview Kartu Profil">
        </div>
        <div class="share-action-buttons">
            <a id="whatsapp-share-btn" href="#" target="_blank" class="btn-wa">
                <i class="fab fa-whatsapp"></i> Kirim WA
            </a>
            <a id="download-img-btn" href="#" download="profil-masteja.png" class="btn-download">
                <i class="fas fa-download"></i> Unduh
            </a>
        </div>
        <button class="close-share-modal" onclick="closeShareModal()">Tutup</button>
    </div>
</div>

<!-- Canvas Tersembunyi -->
<canvas id="share-canvas" width="800" height="450"></canvas>

<footer>
    <p>Database Media Versi 3.4 barudak shoutul masteja - Update 2025</p>
    <p style="margin: 5px 0;">dung tak tak adun muid</p>
    <p style="margin-top: 5px; color: var(--primary-dark); font-weight: bold;">Shollu 'alan Nabi Muhammad!</p>
</footer>

<script>
    const dataPersonil = [
        { nama: "Bapak Wahyudi", peran: "Pembina & Pimpinan", desc: "Tokoh utama penanggung jawab sekaligus pembimbing kedisiplinan dan arah perkembangan group hadroh Shoutul Masteja.", foto: "wahyudi.jpg" },
        { nama: "GUS WAHID", peran: "Vokalis Utama", desc: "Membawakan vokal utama dalam setiap lantunan shalawat dengan penuh penghayatan.", foto: "wahid.jpg" },
        { nama: "GUS PANDI", peran: "Pemain Rebana", desc: "Pengatur tempo dan ketukan dasar yang menjaga kestabilan irama tabuhan hadroh.", foto: "pandi.jpg" },
        { nama: "RONIUS", peran: "Pemain Rebana", desc: "Pengatur tempo dan ketukan dasar yang menjaga kestabilan irama tabuhan hadroh.", foto: "bahron.jpg" },
        { nama: "GUS ALDI", peran: "Pemain Rebana", desc: "Pengatur tempo dan ketukan dasar yang menjaga kestabilan irama tabuhan hadroh.", foto: "aldi.jpg" },
        { nama: "GUS BAHRUL", peran: "Pemain Rebana", desc: "Pengatur tempo dan ketukan dasar yang menjaga kestabilan irama tabuhan hadroh.", foto: "bahrul.jpg" },
        { nama: "RAY", peran: "Pemain Darbuka", desc: "Ahli ritme cepat dan dinamis yang memberikan variasi ketukan meriah pada setiap penampilan.", foto: "ray.jpg" },
        { nama: "GUS EPU", peran: "Pemain Bas", desc: "Pengatur tempo dan ketukan dasar yang menjaga kestabilan irama tabuhan hadroh.", foto: "epu.jpg" }
    ];

    const container = document.getElementById('profile-container');

    function loadProfiles() {
        container.innerHTML = '';
        dataPersonil.forEach((p, index) => {
            const card = document.createElement('div');
            card.className = 'profile-card';
            card.innerHTML = `
                <button class="card-menu-btn" onclick="toggleMenu(event, ${index})">
                    <i class="fas fa-ellipsis-v"></i>
                </button>
                <div class="card-dropdown-menu" id="menu-${index}">
                    <button class="dropdown-item" onclick="generateAndShareProfile('${p.nama}', '${p.peran}', '${p.desc}', '${p.foto}')">
                        <i class="fas fa-share-alt" style="color: #25D366;"></i> Bagikan Profil
                    </button>
                </div>
                <div class="profile-avatar-wrapper">
                    <img src="${p.foto}" alt="${p.nama}" class="clickable-photo" data-src="${p.foto}" onerror="this.src='logo-masteja.png'" title="Klik untuk lihat foto full screen">
                </div>
                <div class="profile-details">
                    <div class="profile-name-tag">
                        <span class="profile-name">${p.nama}</span>
                        <span class="profile-badge">${p.peran}</span>
                    </div>
                    <p class="profile-desc">${p.desc}</p>
                </div>
            `;
            container.appendChild(card);
        });

        initFullscreenPhoto();
    }

    function toggleMenu(event, index) {
        event.stopPropagation();
        document.querySelectorAll('.card-dropdown-menu').forEach((menu, i) => {
            if (i !== index) menu.classList.remove('active');
        });
        const currentMenu = document.getElementById(`menu-${index}`);
        currentMenu.classList.toggle('active');
    }

    window.addEventListener('click', () => {
        document.querySelectorAll('.card-dropdown-menu').forEach(menu => {
            menu.classList.remove('active');
        });
    });

    // Proses Pembuatan Kartu & Sistem Berbagi Multi-Platform (HP & PC)
    function generateAndShareProfile(nama, peran, desc, fotoSrc) {
        const canvas = document.getElementById('share-canvas');
        const ctx = canvas.getContext('2d');
        
        const img = new Image();
        // Atur crossOrigin agar aman dari pembatasan server hosting (CORS)
        img.crossOrigin = "anonymous";
        img.src = fotoSrc;

        img.onload = function() {
            renderCanvasContent(ctx, canvas, img, nama, peran, desc);
            finalizeSharing(canvas, nama, peran);
        };

        img.onerror = function() {
            // Jika foto gagal dimuat di server, pakai logo cadangan
            const fallbackImg = new Image();
            fallbackImg.crossOrigin = "anonymous";
            fallbackImg.src = 'logo-masteja.png';
            fallbackImg.onload = function() {
                renderCanvasContent(ctx, canvas, fallbackImg, nama, peran, desc);
                finalizeSharing(canvas, nama, peran);
            };
        };
    }

    function renderCanvasContent(ctx, canvas, img, nama, peran, desc) {
        // Latar belakang putih kartu
        ctx.fillStyle = "#ffffff";
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // Bingkai luar tipis
        ctx.strokeStyle = "#e2e8f0";
        ctx.lineWidth = 4;
        ctx.strokeRect(0, 0, canvas.width, canvas.height);

        // Aksen garis kuning kiri
        ctx.fillStyle = "#FFD700";
        ctx.fillRect(0, 0, 16, canvas.height);

        // Foto Lingkaran
        ctx.save();
        ctx.beginPath();
        ctx.arc(140, 225, 90, 0, Math.PI * 2, true);
        ctx.closePath();
        ctx.clip();
        ctx.drawImage(img, 50, 135, 180, 180);
        ctx.restore();

        // Border Lingkaran Foto
        ctx.beginPath();
        ctx.arc(140, 225, 90, 0, Math.PI * 2, true);
        ctx.lineWidth = 6;
        ctx.strokeStyle = "#FFD700";
        ctx.stroke();

        // Teks Nama
        ctx.fillStyle = "#0f172a";
        ctx.font = "bold 32px 'Inter', sans-serif";
        ctx.fillText(nama, 270, 165);

        // Badge Peran
        ctx.fillStyle = "#fef3c7";
        ctx.beginPath();
        ctx.roundRect(270, 190, ctx.measureText(peran).width + 24, 34, 17);
        ctx.fill();

        ctx.fillStyle = "#92400e";
        ctx.font = "bold 16px 'Inter', sans-serif";
        ctx.fillText(peran.toUpperCase(), 282, 213);

        // Deskripsi
        ctx.fillStyle = "#64748b";
        ctx.font = "18px 'Inter', sans-serif";
        wrapText(ctx, desc, 270, 260, 480, 26);

        // Watermark Shoutul Masteja
        ctx.fillStyle = "rgba(184, 155, 0, 0.3)";
        ctx.font = "bold 22px 'Inter', sans-serif";
        ctx.textAlign = "right";
        ctx.fillText("SHOUTUL MASTEJA", canvas.width - 30, canvas.height - 25);
        ctx.textAlign = "left"; // reset
    }

    function finalizeSharing(canvas, nama, peran) {
        const dataUrl = canvas.toDataURL('image/png');
        
        // Deteksi apakah perangkat mendukung Web Share API File (Biasanya HP Android/iOS)
        canvas.toBlob(async function(blob) {
            const file = new File([blob], `profil-${nama.replace(/\s+/g, '-').toLowerCase()}.png`, { type: "png" });
            
            if (navigator.canShare && navigator.canShare({ files: [file] })) {
                try {
                    await navigator.share({
                        title: `Profil ${nama}`,
                        text: `Kenali ${nama} (${peran}) dari Shoutul Masteja! Shollu 'alan Nabi Muhammad.`,
                        files: [file]
                    });
                    return; // Berhasil dibagikan lewat menu HP native
                } catch (err) {
                    console.log('Share dibatalkan atau dialihkan ke modal web');
                }
            }

            // Jika di PC/Laptop atau browser tidak mendukung file share, tampilkan Modal Interaktif
            showShareModal(dataUrl, nama, peran);
        }, 'image/png');
    }

    function showShareModal(dataUrl, nama, peran) {
        const modal = document.getElementById('share-modal');
        const resultImg = document.getElementById('share-result-img');
        const downloadBtn = document.getElementById('download-img-btn');
        const waBtn = document.getElementById('whatsapp-share-btn');

        resultImg.src = dataUrl;
        downloadBtn.href = dataUrl;
        downloadBtn.download = `profil-${nama.replace(/\s+/g, '-').toLowerCase()}.png`;

        // Link Share WhatsApp Web / Desktop
        const textMessage = encodeURIComponent(`Halo! Kenalan yuk dengan ${nama} (${peran}) dari Shoutul Masteja. Shollu 'alan Nabi Muhammad! 🎤✨\n\n(Simpan gambar kartu profil ini ya!)`);
        waBtn.href = `https://api.whatsapp.com/send?text=${textMessage}`;

        modal.style.display = 'flex';
    }

    function closeShareModal() {
        document.getElementById('share-modal').style.display = 'none';
    }

    function wrapText(context, text, x, y, maxWidth, lineHeight) {
        const words = text.split(' ');
        let line = '';
        for(let n = 0; n < words.length; n++) {
            const testLine = line + words[n] + ' ';
            const metrics = context.measureText(testLine);
            const testWidth = metrics.width;
            if (testWidth > maxWidth && n > 0) {
                context.fillText(line, x, y);
                line = words[n] + ' ';
                y += lineHeight;
            } else {
                line = testLine;
            }
        }
        context.fillText(line, x, y);
    }

    function initFullscreenPhoto() {
        const modal = document.getElementById('fullscreen-modal');
        const modalImg = document.getElementById('modal-img');
        const closeBtn = document.getElementById('close-modal');
        const photos = document.querySelectorAll('.clickable-photo');

        photos.forEach(photo => {
            photo.addEventListener('click', function() {
                modal.style.display = 'flex';
                modalImg.src = this.getAttribute('data-src');
            });
        });

        closeBtn.addEventListener('click', function() { modal.style.display = 'none'; });
        modal.addEventListener('click', function(e) { if (e.target === modal) modal.style.display = 'none'; });
    }

    loadProfiles();
</script>

</body>
</html>
