<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profil Personil - Shoutul Masteja</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Meta Tags SEO & Deskripsi -->
    <meta name="description" content="Profil Personil Resmi Shoutul Masteja - Kenali lebih dekat para anggota dan pengurus grup hadroh." />
    <meta name="keywords" content="profil personil, anggota shoutul masteja, hadroh, sholawat" />
    <meta name="author" content="Shoutul Masteja Official" />

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="logo-masteja.png">
    <link rel="apple-touch-icon" href="logo-masteja.png">

    <style>
        :root {
            --primary: #FFD700;
            --primary-dark: #b89b00;
            --bg-light: #f4f6f8;
            --card-bg: #ffffff;
            --text-dark: #1e293b;
            --text-gray: #64748b;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { background-color: var(--bg-light); color: var(--text-dark); line-height: 1.6; }

        /* Navigation */
        nav {
            background: rgba(255, 255, 255, 0.9);
            padding: 15px 20px;
            position: sticky;
            top: 0;
            z-index: 1000;
            border-bottom: 2px solid #e2e8f0;
            backdrop-filter: blur(10px);
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.02);
        }

        .nav-container {
            display: flex;
            align-items: center;
            justify-content: space-between;
            max-width: 1000px;
            margin: 0 auto;
        }

        .brand-logo-img {
            display: flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
        }

        .brand-logo-img img {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid var(--primary);
            background-color: #121212;
        }

        .brand-logo-text .title {
            font-size: 0.9rem;
            font-weight: 800;
            text-transform: uppercase;
            color: #111;
        }

        .brand-logo-text .subtitle {
            font-size: 0.6rem;
            color: var(--primary-dark);
            font-weight: bold;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .nav-back-btn {
            background: #111;
            color: var(--primary);
            padding: 7px 14px;
            border-radius: 6px;
            text-decoration: none;
            font-size: 0.8rem;
            font-weight: bold;
            transition: 0.2s;
        }

        .nav-back-btn:hover {
            background: var(--primary);
            color: #000;
        }

        /* Header Info */
        header { 
            text-align: center; 
            max-width: 700px;
            margin: 40px auto 30px;
            padding: 0 20px;
        }
        
        h1 { 
            color: #0f172a; 
            margin-bottom: 8px; 
            font-size: 1.8rem; 
            text-transform: uppercase; 
            letter-spacing: 1px;
        }

        header p {
            color: var(--text-gray);
            font-size: 0.88rem;
        }

        /* Profile Layout (Berbeda dari Galeri yang berbentuk Grid Kotak Foto) */
        .profile-container {
            max-width: 850px;
            margin: 0 auto 50px;
            padding: 0 20px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .profile-card {
            background: var(--card-bg);
            border-radius: 16px;
            padding: 24px;
            display: flex;
            align-items: center;
            gap: 24px;
            border: 1px solid #e2e8f0;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.04);
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        /* Aksen garis kuning elegan di sebelah kiri kartu */
        .profile-card::before {
            content: '';
            position: absolute;
            left: 0;
            top: 0;
            height: 100%;
            width: 5px;
            background: var(--primary);
        }

        .profile-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 30px -5px rgba(0, 0, 0, 0.08);
            border-color: #cbd5e1;
        }

        .profile-avatar-wrapper {
            flex-shrink: 0;
            width: 100px;
            height: 100px;
            border-radius: 50%;
            overflow: hidden;
            border: 3px solid var(--primary);
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            background: #000;
        }

        .profile-avatar-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            cursor: pointer;
            transition: transform 0.3s ease, opacity 0.2s;
        }

        .profile-avatar-wrapper img:hover {
            transform: scale(1.08);
            opacity: 0.9;
        }

        .profile-details {
            flex-grow: 1;
        }

        .profile-name-tag {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 6px;
        }

        .profile-name {
            font-size: 1.15rem;
            font-weight: 700;
            color: #0f172a;
        }

        .profile-badge {
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            padding: 4px 10px;
            background: #fef3c7;
            color: #92400e;
            border-radius: 20px;
            font-weight: 700;
        }

        .profile-desc {
            font-size: 0.85rem;
            color: var(--text-gray);
            line-height: 1.5;
        }

        /* FULL SCREEN MODAL / LIGHTBOX STYLING */
        #fullscreen-modal {
            display: none;
            position: fixed;
            z-index: 9999;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.9);
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        #fullscreen-modal img {
            max-width: 90%;
            max-height: 90vh;
            object-fit: contain;
            border-radius: 8px;
            box-shadow: 0 5px 25px rgba(0,0,0,0.5);
            animation: zoomIn 0.25s ease;
        }

        #fullscreen-modal .close-btn {
            position: absolute;
            top: 20px;
            right: 30px;
            color: #fff;
            font-size: 40px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }

        #fullscreen-modal .close-btn:hover {
            color: var(--primary);
        }

        @keyframes zoomIn {
            from { transform: scale(0.85); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        /* Responsif untuk HP */
        @media (max-width: 600px) {
            .profile-card {
                flex-direction: column;
                text-align: center;
                padding: 20px;
            }
            .profile-name-tag {
                justify-content: center;
            }
            .profile-avatar-wrapper {
                width: 90px;
                height: 90px;
                margin: 0 auto;
            }
        }

        /* Footer */
        footer { 
            text-align: center; 
            padding: 30px 20px; 
            color: #666; 
            font-size: 0.8rem; 
            background: #ffffff; 
            border-top: 1px solid #e2e8f0; 
        }
    </style>
</head>
<body>

<nav>
    <div class="nav-container">
        <a href="index.html" class="brand-logo-img">
            <img src="logo-masteja.png" alt="Logo">
            <div class="brand-logo-text">
                <div class="title">Shoutul Masteja</div>
                <div class="subtitle">Hadroh Official</div>
            </div>
        </a>
        <a href="index.html" class="nav-back-btn"><i class="fas fa-home"></i> Beranda</a>
    </div>
</nav>

<header>
    <h1>Profil Personil</h1>
    <p>Daftar resmi anggota, pengurus, dan punggawa group hadroh Shoutul Masteja</p>
</header>

<!-- DAFTAR PROFILE MODEL HORIZONTAL LIST -->
<div class="profile-container" id="profile-container">
    <!-- Konten dimuat secara dinamis via script di bawah -->
</div>

<!-- ELEMEN MODAL FULL SCREEN FOTO -->
<div id="fullscreen-modal">
    <span class="close-btn" id="close-modal">&times;</span>
    <img id="modal-img" src="" alt="Full Screen Preview">
</div>

<footer>
    <p>Database Media Versi 3.4 barudak shoutul masteja - Update 2025</p>
    <p style="margin: 5px 0;">dung tak tak adun muid</p>
    <p style="margin-top: 5px; color: var(--primary-dark); font-weight: bold;">Shollu 'alan Nabi Muhammad!</p>
</footer>

<script>
    // Data Personil (Silakan ubah nama, peran, deskripsi, dan nama file fotonya sesuai kebutuhan)
    const dataPersonil = [
        {
            nama: "Bapak Wahyudi",
            peran: "Pembina & Pimpinan",
            desc: "Tokoh utama penanggung jawab sekaligus pembimbing kedisiplinan dan arah perkembangan group hadroh Shoutul Masteja.",
            foto: "wahyudi.jpg"
        },
        {
            nama: "GUS WAHID",
            peran: "Vokalis Utama",
            desc: "Membawakan vokal utama dalam setiap lantunan shalawat dengan penuh penghayatan.",
            foto: "wahid.jpg"
        },
        {
            nama: "GUS PANDI",
            peran: "Pemain Rebana",
            desc: "Pengatur tempo dan ketukan dasar yang menjaga kestabilan irama tabuhan hadroh.",
            foto: "pandi.jpg"
        },
        {
            nama: " RONIUS",
            peran: "Pemain Rebana",
            desc: "Pengatur tempo dan ketukan dasar yang menjaga kestabilan irama tabuhan hadroh.",
            foto: "bahron.jpg"
        },
        {
            nama: "GUS ALDI",
            peran: "Pemain Rebana",
            desc: "Pengatur tempo dan ketukan dasar yang menjaga kestabilan irama tabuhan hadroh.",
            foto: "aldi.jpg"
        },
        {
            nama: "GUS BAHRUL",
            peran: "Pemain Rebana",
            desc: "Pengatur tempo dan ketukan dasar yang menjaga kestabilan irama tabuhan hadroh.",
            foto: "bahrul.jpg"
        },
        {
            nama: "RAY",
            peran: "Pemain Darbuka",
            desc: "Ahli ritme cepat dan dinamis yang memberikan variasi ketukan meriah pada setiap penampilan.",
            foto: "ray.jpg"
        },
        {
            nama: "GUS EPU",
            peran: "Pemain bas",
            desc: "Pengatur tempo dan ketukan dasar yang menjaga kestabilan irama tabuhan hadroh.",
            foto: "epu.jpg"
        }
    ];

    const container = document.getElementById('profile-container');

    function loadProfiles() {
        container.innerHTML = '';
        dataPersonil.forEach(p => {
            const card = document.createElement('div');
            card.className = 'profile-card';
            card.innerHTML = `
                <div class="profile-avatar-wrapper">
                    <img src="${p.foto}" alt="${p.nama}" class="clickable-photo" data-src="${p.foto}" onerror="this.src='logo-masteja.png'" title="Klik untuk lihat foto full screen">
                </div>
                <div class="profile-details">
                    <div class="profile-name-tag">
                        <span class="profile-name">${p.nama}</span>
                        <span class="profile-badge">${p.peran}</span>
                    </div>
                    <p class="profile-desc">${p.desc}</p>
                </div>
            `;
            container.appendChild(card);
        });

        initFullscreenPhoto();
    }

    // Fungsi Interaktif Modal Full Screen Foto
    function initFullscreenPhoto() {
        const modal = document.getElementById('fullscreen-modal');
        const modalImg = document.getElementById('modal-img');
        const closeBtn = document.getElementById('close-modal');
        const photos = document.querySelectorAll('.clickable-photo');

        photos.forEach(photo => {
            photo.addEventListener('click', function() {
                modal.style.display = 'flex';
                modalImg.src = this.getAttribute('data-src');
            });
        });

        closeBtn.addEventListener('click', function() {
            modal.style.display = 'none';
        });

        modal.addEventListener('click', function(e) {
            if (e.target === modal) {
                modal.style.display = 'none';
            }
        });
    }

    // Jalankan fungsi saat halaman dimuat
    loadProfiles();
</script>

</body>
</html>
