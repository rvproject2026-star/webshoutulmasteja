<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pusat Informasi - Shoutul Masteja</title>
    
    <!-- OneSignal Web SDK -->
    <script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
    <script>
      window.OneSignalDeferred = window.OneSignalDeferred || [];
      OneSignalDeferred.push(async function(OneSignal) {
        await OneSignal.init({
          appId: "e83fefef-4985-4063-a3ad-466901568c36",
          serviceWorkerParam: { scope: "/" },
          serviceWorkerPath: "OneSignalSDKWorker.js"
        });
      });
    </script>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --primary: #FFD700;
            --primary-dark: #b89b00;
            --bg-light: #f8f9fa;
            --card-bg: #fdfbf7; /* Warna Cream Lembut */
            --text-dark: #212529;
            --text-gray: #555555;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', 'Segoe UI', sans-serif; }
        body { background: var(--bg-light); color: var(--text-dark); min-height: 100vh; display: flex; flex-direction: column; }
        
        header { 
            background: rgba(255, 255, 255, 0.95); 
            padding: 15px 20px; 
            display: flex; 
            align-items: center; 
            gap: 15px; 
            border-bottom: 3px solid var(--primary); 
            position: sticky; 
            top: 0; 
            z-index: 10; 
            backdrop-filter: blur(10px);
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }

        .group-icon-img {
            width: 42px; 
            height: 42px; 
            border-radius: 50%; 
            overflow: hidden; 
            border: 2px solid var(--primary); 
            background: #121212; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            box-shadow: 0 0 10px rgba(255, 215, 0, 0.3);
            flex-shrink: 0;
        }

        .group-icon-img img {
            width: 100%; 
            height: 100%; 
            object-fit: cover;
        }

        .group-info h4 { color: #111; font-size: 1rem; font-weight: 700; text-transform: uppercase; }
        .group-info p { font-size: 0.75rem; color: var(--text-gray); margin-top: 2px; }

        #chat-box { 
            flex: 1; 
            padding: 20px; 
            padding-bottom: 30px; 
            display: flex; 
            flex-direction: column; 
            gap: 15px; 
            max-width: 800px;
            width: 100%;
            margin: 0 auto;
        }

        .msg { 
            padding: 12px 16px; 
            border-radius: 12px; 
            max-width: 85%; 
            font-size: 0.9rem; 
            line-height: 1.6; 
            white-space: pre-wrap; 
            word-wrap: break-word; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }

        .mine { 
            align-self: flex-end; 
            background: #111; 
            color: var(--primary); 
            border: 1px solid var(--primary);
            border-bottom-right-radius: 2px; 
        }

        .others { 
            align-self: flex-start; 
            background: var(--card-bg); 
            color: #111; 
            border: 2px solid #222; 
            border-left: 6px solid var(--primary);
            border-bottom-left-radius: 2px; 
        }

        .bottom-controls { 
            background: rgba(255, 255, 255, 0.95); 
            padding: 15px 20px 35px 20px; 
            display: flex; 
            align-items: flex-end; 
            gap: 10px; 
            border-top: 1px solid #e5e5e5; 
            position: sticky; 
            bottom: 0; 
            z-index: 10; 
            max-width: 800px;
            width: 100%;
            margin: 0 auto;
            backdrop-filter: blur(10px);
        }

        .btn-tool { 
            background: #111; 
            color: var(--primary); 
            border: 1px solid var(--primary); 
            width: 45px; 
            height: 45px; 
            border-radius: 50%; 
            font-size: 1rem; 
            cursor: pointer; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            flex-shrink: 0; 
            transition: 0.3s;
        }

        .btn-tool:hover {
            background: var(--primary);
            color: #000;
        }

        #chat-form { flex: 1; display: flex; gap: 10px; }

        #input-msg { 
            flex: 1; 
            background: #fff; 
            border: 2px solid #ddd; 
            color: #333; 
            padding: 12px 18px; 
            border-radius: 25px; 
            outline: none; 
            height: 45px; 
            resize: none; 
            font-size: 0.9rem; 
            transition: 0.3s;
        }

        #input-msg:focus {
            border-color: var(--primary);
            box-shadow: 0 0 10px rgba(255, 215, 0, 0.2);
        }

        .btn-send { 
            background: #111; 
            color: var(--primary); 
            border: 1px solid var(--primary); 
            width: 45px; 
            height: 45px; 
            border-radius: 50%; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            flex-shrink: 0; 
            cursor: pointer;
            transition: 0.3s;
        }

        .btn-send:hover {
            background: var(--primary);
            color: #000;
        }

        /* POPUP MODAL STYLING */
        #popup-screen { 
            position: fixed; 
            inset: 0; 
            background: rgba(0, 0, 0, 0.6); 
            display: none; 
            justify-content: center; 
            align-items: center; 
            z-index: 100; 
            padding: 20px; 
            backdrop-filter: blur(5px);
        }

        .popup-box { 
            width: 100%; 
            max-width: 340px; 
            display: flex; 
            flex-direction: column; 
            gap: 15px; 
            background: var(--card-bg);
            padding: 30px;
            border-radius: 20px;
            border: 2px solid #222;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            text-align: center;
        }

        .popup-icon {
            font-size: 40px;
            color: var(--primary-dark);
            margin-bottom: -5px;
        }

        .input-name { 
            background: #fff; 
            border: 2px solid #ddd; 
            color: #333; 
            padding: 12px 18px; 
            border-radius: 25px; 
            outline: none; 
            font-size: 0.9rem; 
            width: 100%; 
            transition: 0.3s;
            text-align: center;
        }

        .input-name:focus {
            border-color: var(--primary);
        }

        .btn-save-name { 
            background: #111; 
            color: var(--primary); 
            border: 1px solid var(--primary); 
            padding: 12px 20px; 
            border-radius: 25px; 
            font-weight: bold; 
            font-size: 0.9rem; 
            cursor: pointer; 
            transition: 0.3s;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        .btn-save-name:hover {
            background: var(--primary);
            color: #000;
        }
    </style>
</head>
<body>

    <!-- POPUP INPUT NAMA (MUNCUL SAAT MAU MENGETIK PESAN) -->
    <div id="popup-screen">
        <div class="popup-box">
            <div class="popup-icon"><i class="fas fa-id-badge"></i></div>
            <h3 style="color: #111; font-size: 1.1rem;">Kenalan Dulu Yuk!</h3>
            <p style="font-size: 0.8rem; color: var(--text-gray);">Masukkan namamu terlebih dahulu sebelum mulai mengetik informasi.</p>
            <input type="text" id="user-name-input" class="input-name" placeholder="Tulis nama kamu di sini..." required>
            <button class="btn-save-name" onclick="simpanNamaUser()">SIMPAN & LANJUTKAN</button>
        </div>
    </div>

    <header>
        <div class="group-icon-img">
            <img src="logo-masteja.png" alt="Logo">
        </div>
        <div class="group-info">
            <h4>Shoutul Masteja Info</h4>
            <p>Tekan agak lama pada pesan untuk menghapus pesan</p>
        </div>
    </header>

    <div id="chat-box"></div>

    <div class="bottom-controls">
        <button type="button" class="btn-tool" onclick="pakaiTemplate()" title="Buat Pengumuman">
            <i class="fas fa-bullhorn"></i>
        </button>
        <form id="chat-form">
            <textarea id="input-msg" placeholder="Tulis pesan informasi..."></textarea>
            <button type="submit" class="btn-send"><i class="fas fa-paper-plane"></i></button>
        </form>
    </div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, collection, addDoc, deleteDoc, doc, query, orderBy, limit, onSnapshot, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const firebaseConfig = { 
      apiKey : "AIzaSyCtx2nxthZPvrOhItetKKNzCWAr0gyTMtU", 
      authDomain : "shoutulmasteja.firebaseapp.com", 
      projectId : "shoutulmasteja", 
      storageBucket : "shoutulmasteja.firebasestorage.app", 
      messagingSenderId : "153000633436", 
      appId : "1:153000633436:web:2a4a469bc647fb0679f299", 
      measurementId : "G-8TWMTF4H3E" 
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    let currentUserName = localStorage.getItem('sm_username_simple') || null;
    let isInitialLoad = true;

    function mintaIzinNotifikasi() {
        if ("Notification" in window && Notification.permission !== "granted" && Notification.permission !== "denied") {
            Notification.requestPermission();
        }
    }

    function tampilkanNotifikasiLokal(pengirim, teks) {
        if ("Notification" in window && Notification.permission === "granted") {
            new Notification(`Pesan baru dari ${pengirim}`, {
                body: teks,
                icon: 'https://cdn-icons-png.flaticon.com/512/134/134937.png'
            });
        }
    }

    // Event listener saat kolom pesan mulai diklik/diketik (fokus)
    const inputMsg = document.getElementById('input-msg');
    inputMsg.addEventListener('focus', (e) => {
        if (!currentUserName) {
            e.preventDefault();
            inputMsg.blur(); // Lepas fokus keyboard HP supaya tidak mengganggu popup
            document.getElementById('popup-screen').style.display = 'flex';
        }
    });

    // Fungsi saat tombol simpan nama di popup ditekan
    window.simpanNamaUser = () => {
        const inputVal = document.getElementById('user-name-input').value.trim();
        if (!inputVal) {
            alert("Harap masukkan nama kamu terlebih dahulu!");
            return;
        }

        currentUserName = inputVal;
        localStorage.setItem('sm_username_simple', currentUserName);

        document.getElementById('popup-screen').style.display = 'none';
        mintaIzinNotifikasi();
        
        // Kembalikan fokus ke kolom input pesan setelah nama disimpan
        inputMsg.focus();
    };

    window.pakaiTemplate = () => {
        // Cek nama dulu sebelum pakai template
        if (!currentUserName) {
            document.getElementById('popup-screen').style.display = 'flex';
            return;
        }

        inputMsg.value = "📢 *PENGUMUMAN SHOUTUL MASTEJA*\n\n📍 Alamat: \n💼 Job: \n⏰ Tempat: \n⌛ Waktu: \n\nHayu urang gembrung!";
        inputMsg.style.height = "140px"; 
        inputMsg.focus();
    };

    document.getElementById('chat-form').onsubmit = async (e) => {
        e.preventDefault();
        
        if (!currentUserName) {
            document.getElementById('popup-screen').style.display = 'flex';
            return;
        }

        const teks = inputMsg.value.trim();
        if (!teks) return;
        
        try {
            await addDoc(collection(db, "messages"), {
                text: teks,
                name: currentUserName,
                time: serverTimestamp()
            });

            inputMsg.value = "";
            inputMsg.style.height = "45px";
        } catch (err) { 
            alert(err.message); 
        }
    };

    function muatPesan() {
        const q = query(collection(db, "messages"), orderBy("time", "asc"), limit(50));
        
        onSnapshot(q, (snapshot) => {
            const box = document.getElementById('chat-box');
            
            snapshot.docChanges().forEach((change) => {
                if (change.type === "added") {
                    const dataPesan = change.doc.data();
                    
                    if (!isInitialLoad && currentUserName && dataPesan.name !== currentUserName) {
                        tampilkanNotifikasiLokal(dataPesan.name, dataPesan.text);
                    }
                }
            });

            box.innerHTML = "";
            snapshot.forEach((docSnap) => {
                const d = docSnap.data();
                const isMine = currentUserName && d.name === currentUserName;
                const div = document.createElement('div');
                div.className = `msg ${isMine ? 'mine' : 'others'}`;
                div.innerHTML = `<span style="font-size:11px; font-weight:bold; display:block; margin-bottom:4px; color:${isMine?'var(--primary)':'var(--primary-dark)'}">${d.name}</span>${d.text}`;
                
                let timer;
                div.ontouchstart = () => {
                    timer = setTimeout(() => {
                        if (confirm("Hapus pesan ini?")) {
                            deleteDoc(doc(db, "messages", docSnap.id));
                        }
                    }, 800);
                };
                div.ontouchend = () => clearTimeout(timer);

                box.appendChild(div);
            });

            isInitialLoad = false;
            window.scrollTo(0, document.body.scrollHeight);
        });
    }

    // Jalankan pemuatan pesan agar bisa langsung dibaca saat pertama kali buka halaman
    muatPesan();
</script>

</body>
</html>
